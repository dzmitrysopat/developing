<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Забронировать столик</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <form action="" method="post">
        <fieldset>
            <legend>Бронирование столика в ресторанном комплексе «Прованс»</legend>
            <label for="name">Ваше имя
                <input type="text" id="name" name="name">
            </label>

            <label for="tel">Мобильный телефон
                <input type="tel" name="tel" id="tel">
            </label>

            <label for="email">E-mail
                <input type="email" name="email" id="email">
            </label>

            <label for="number">Количество персон
                <input type="number" name="number" id="number" min="1">
            </label>

            <label for="date">Дата посещения
                <input type="date" name="date" id="date">
            </label>

            <label for="time">Время посещения
                <input type="time" name="time" id="time">
            </label>

            <label for="comment">Комментарий
                <textarea name="comment" id="comment" cols="100" rows="20" placeholder="Пожелание к брони"></textarea>
            </label>

            <button type="submit">Забронировать</button>
        </fieldset>
    </form>
</body>
</html>
