<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forms hw_03</title>
    <!-- <style>
        fieldset{
            display: flex;
            flex-direction: column;
            width: fit-content;
        }
    </style> -->
</head>
<body>
    <form action="">
        <fieldset>
            <legend>Форма обратной связи</legend>

            <label for="secondName">Ваша фамилия</label>
            <input type="text" name="secondName" id="secondName">

            <br><br>

            <label for="Name">Ваше Имя</label>
            <input type="text" name="Name" id="Name" required>

            <br><br>

            <label for="phone">Мобильный телефон</label>
            <input type="tel" required name="phone" id="phone" pattern="+375[2-3][2-9]-[0-9]{3}-[0-9]{2}-[0-9]{2}" value="+375">
            
            <br><br>
            <label for="email">E-mail</label>
            <input type="email" name="email" id="email">
            <br><br>

            <label for="question">Тема обращения</label>
            <select name="question" id="question">
                <option value="choose" hidden>Выберите тему обращения</option>
                <option value="dontwork">Не работает интернет</option>
                <option value="wannainternet">Необходимо подключение</option>
                <option value="anotherPlan">сменить тариф</option>
                <option value="disable">Отключить интернет</option>
                <optgroup>
                    <!-- <option value="choose1" hidden>Выберите тему обращения</option> -->
                <option value="dontwork1">Не работает интернет</option>
                <option value="wannainternet1">Необходимо подключение юр.лица</option>
                <option value="anotherPlan1">сменить тариф юр.лицу</option>
                <option value="disable1">Отключить интернет юр.лицу</option>
                <option value="disable1">Сменить адрес юр.лицу</option>
                </optgroup>
            </select>
            <br><br>
            <label for="message">Сообщение:</label>
            <br>
            <textarea name="message" id="message" placeholder="Введите текст вашего сообщения..." cols="105" rows="15"></textarea>
            <br><br>
            <input type="file" name="file" id="file">
            <label for="file"></label>
            <br><br>
            <input type="checkbox" name="agree" id="agree" checked>
            <label for="agree">Вы соглашаетесь с тем, чтобы мы обрабатывали Ваши данные для предоставления Вам обратной связи.</label>
            <br><br>
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </fieldset>
    </form>
</body>
</html>
