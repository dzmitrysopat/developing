<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Forms</title>
</head>
<body>
    <form action="">
        <fieldset>
            <legend>Форма обратной связи</legend>
            <label for="surname">Ваша фамилия</label>
            <input type="text" id="surname">

            <label for="name">Ваше имя</label>
            <input type="text" id="name">

            <label for="phone">Мобильный телефон</label>
            <input type="tel" name="" id="phone" pattern="[0-9]{3}-[0-9]{2}-[0-9]{2}" value="+375">

            <label for="email">E-mail</label>
            <input type="email" name="email" id="email">

            <label for="list">Тема обращения</label>
            <select name="" id="">
                <option value="" hidden>Выберите тему обращения</option>
                <option value="">01</option>
                <option value="">02</option>
                <option value="">03</option>
            </select>

            <label for="message">Сообщение</label>
            <textarea name="" id="message"></textarea>

            <input type="file" name="" id="">

            <input type="checkbox" checked name="" id="agree" required>
            <label for="agree">Вы соглашаетесь с тем, чтобы мы обрабатывали Ваши данные для предоставления Вам обратной связи</label>
            
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </fieldset>
    </form>
</body>
</html>
