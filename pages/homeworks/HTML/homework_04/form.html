<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Забронировать столик</title>
    <!-- <style>
        fieldset{
            display: flex;
            flex-direction: column;
        }
    </style> -->
</head>
<body>
    <form>
        <fieldset>
            <legend>Бронирование столика в ресторанном комплексе «Прованс»</legend>
            <label for="name">Ваше имя</label>
            <input type="text" id="name" name="name">
            <br><br>
            <label for="phone">Мобильный телефон</label>
            <input type="tel" id="phone" name="phone" placeholder="+375  (__) ___-__-__">
            <br><br>
            <label for="email">Email</label>
            <input type="email" id="email" name="email">
            <br><br>
            <label for="col">Количество персон</label>
            <input type="number" id="col" min="1" name="col">
            <br><br>
            <label for="date">Дата посещения</label>
            <input type="date" name="date" id="date">
            <br><br>
            <label for="time">Время посещения</label>
            <input type="time" name="time" id="time">
            <br><br>
            <label for="comment">Комментарий</label>            <br><br>

            <textarea name="comment" id="comment" placeholder="Пожелание к брони" cols="100" rows="10"></textarea>
            <br><br>
            <button type="submit">Забронировать</button>
        </fieldset>
    </form>
</body>
</html>
